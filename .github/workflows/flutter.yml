name: Flutter CI

# WHY THIS EXISTS
# ---------------
# SWIP is built in an environment with no Flutter toolchain, so nothing written
# there is compiled. This workflow is the compiler: GitHub runs it on every
# push, and the logs are readable without anyone installing anything locally.
#
# It runs the same three commands you would run on your own machine:
#   bash tool/bootstrap.sh   → generate the platform scaffold, fetch packages
#   flutter analyze          → find compile errors and warnings
#   flutter test             → run the parser and world-QR corpus tests
#
# analyze is allowed to fail so that test still runs — one push then surfaces
# every problem at once instead of one per round trip.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # Regenerates the world QR corpus from the spec so a stale fixture can
      # never silently pass. If the generator and the committed fixture
      # disagree, the diff check below fails loudly.
      - name: Rebuild the QR corpus
        run: node tool/build_qr_corpus.mjs

      - name: Fail if the committed corpus is stale
        run: |
          if ! git diff --quiet -- test/fixtures/qr_corpus.json; then
            echo "::error::test/fixtures/qr_corpus.json is out of date."
            echo "Run: node tool/build_qr_corpus.mjs — then commit the result."
            git diff -- test/fixtures/qr_corpus.json
            exit 1
          fi

      - name: Bootstrap the project
        run: bash tool/bootstrap.sh

      # `F-158`. "No secrets in the repo, ever" was a standing rule enforced
      # by a snippet in a markdown file, which means it ran whenever somebody
      # remembered to paste it. Now it runs on every push. NOT
      # continue-on-error: a leaked key is not something to collect alongside
      # other findings and decide about later.
      - name: Check for secrets
        run: bash tool/check_secrets.sh

      # `F-158`. Catches the class of bug that analyze and test both miss by
      # construction: code that is finished, correct and unreachable. The
      # floating bubble's switch wrote a preference nothing read for four
      # months, and every test passed the whole time — because every piece
      # worked, and what was missing was the wire between them.
      # `F-162`. CLAUDE.md's standing rule is that every claim carries a link
      # and the owner is never left "blind with words". A link that 404s is
      # worse than none — it looks like evidence and is not. Five had rotted
      # before anyone checked.
      - name: Check the doc links
        id: links
        continue-on-error: true
        run: python3 tool/check_links.py

      - name: Check the wiring
        id: wiring
        continue-on-error: true
        run: python3 tool/check_wiring.py

      - name: Analyze
        id: analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos

      - name: Test
        id: test
        continue-on-error: true
        run: flutter test --reporter expanded

      # Both steps above are allowed to fail individually so their output is
      # captured; this makes the job's overall status honest.
      - name: Report
        run: |
          echo "links:   ${{ steps.links.outcome }}"
          echo "wiring:  ${{ steps.wiring.outcome }}"
          echo "analyze: ${{ steps.analyze.outcome }}"
          echo "test:    ${{ steps.test.outcome }}"
          if [ "${{ steps.links.outcome }}" != "success" ] \
          || [ "${{ steps.wiring.outcome }}" != "success" ] \
          || [ "${{ steps.analyze.outcome }}" != "success" ] \
          || [ "${{ steps.test.outcome }}" != "success" ]; then
            echo "::error::links, wiring, analyze or test failed — see above."
            exit 1
          fi
          echo "✓ links resolve, wiring connected, analyze clean, tests green"

  # Proves the app actually assembles into an installable artifact, which
  # `analyze` alone does not. The APK is downloadable from the run page.
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: build
    if: success()
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap
        run: bash tool/bootstrap.sh

      - name: Build debug APK
        run: flutter build apk --debug

      # `F-173`. **The first automated test the floating bubble has ever had.**
      #
      # Every round so far ended with the same honest note: the APK job proves
      # the bubble compiles and nothing proves it behaves. `ShakeDetector`
      # decides whether a snoozed bubble comes back, and both ways it can be
      # wrong are silent — too sensitive and it returns while the user walks,
      # too dull and shaking does nothing. Neither throws.
      #
      # Ordered AFTER the APK build on purpose. Gradle needs the configuration
      # `flutter build` produces (local.properties, the plugin list), so
      # running it first would fail for reasons that have nothing to do with
      # the test. Placed before the upload so a red test does not ship an
      # artifact.
      #
      # NOT continue-on-error. The other gates collect their findings so one
      # push surfaces everything; a failing unit test is a different thing —
      # it means the behaviour under it is wrong right now.
      - name: Run the Kotlin unit tests
        working-directory: app/android
        run: ./gradlew :app:testDebugUnitTest --console=plain

      # `F-173`. **A green test step that ran zero tests looks exactly like a
      # green test step that ran twelve.**
      #
      # Gradle's `test` task prints nothing on success and succeeds happily
      # with an empty source set — so if `src/test/kotlin` ever stops being
      # registered (a bootstrap change, an AGP or Kotlin-plugin bump), the
      # suite would silently stop running and the build would stay green. That
      # is the exact shape of failure this project keeps finding, and it is
      # worse here than usual because the thing it guards is the only
      # automated test the floating bubble has.
      #
      # So the JUnit XML is counted, and zero is a failure.
      - name: Prove the Kotlin tests actually ran
        working-directory: app
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET

          files = glob.glob(
              "build/app/test-results/testDebugUnitTest/*.xml"
          ) + glob.glob(
              "android/app/build/test-results/testDebugUnitTest/*.xml")

          total = failures = errors = 0
          for f in files:
              root = ET.parse(f).getroot()
              total += int(root.get("tests", 0))
              failures += int(root.get("failures", 0))
              errors += int(root.get("errors", 0))

          print(f"{len(files)} result file(s), {total} test(s), "
                f"{failures} failure(s), {errors} error(s)")

          if not files:
              sys.exit("::error::No JUnit XML at all — the Kotlin test source "
                       "set is not being compiled. The suite is not running.")
          if total == 0:
              sys.exit("::error::Gradle reported 0 tests. The suite is not "
                       "running, and the step above passed anyway.")
          if failures or errors:
              sys.exit("::error::Kotlin unit tests failed.")
          print(f"OK - {total} Kotlin test(s) ran and passed")
          PY

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: swip-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          # `F-110`. Five days, not the default ninety.
          #
          # This matters the moment the repository goes private. A public repo
          # gets unlimited Actions minutes and storage; a private repo on the
          # Free plan gets 2,000 Linux minutes and **500 MB of artifact
          # storage**. The debug APK is ~87 MB, so at the default retention the
          # sixth build of the month would fail on quota with nothing obviously
          # wrong in the logs.
          #
          # Five days is longer than any APK here stays interesting and keeps
          # the running total near one build's worth.
          retention-days: 5
