name: swip
description: "SWIP — know the merchant category code of any purchase, before you pay."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State. Riverpod's classic (non-codegen) API is used throughout so that
  # `flutter run` works immediately without a build_runner step.
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Persistence. Hand-written DAOs over sqflite — see 08-ARCHITECTURE for why
  # this is deliberate rather than lazy, and when to migrate to drift.
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

  # Capture
  mobile_scanner: ^5.1.1   # QR — Vector 1
  crypto: ^3.0.3           # `F-127` ledger seal (SHA-256 hash chain)

  # F-40 — where a capture happened. Opt-in, coarse only, and the raw fix never
  # leaves the device: it is reduced to a 6-character geohash (~1.2 km) before
  # anything is stored. See core/location/capture_location.dart.
  geolocator: ^13.0.1
  geocoding: ^3.0.0        # coarse fix -> "Bandra, IN", for the ledger to read

  # Presentation
  flutter_svg: ^2.0.10+1   # brand marks
  intl: ^0.19.0            # dates, currency

  # Motion. flutter_animate (Grant Skinner) is the pick: declarative, composable
  # off any Widget via .animate(), ~zero boilerplate, and it ships the shimmer
  # effect the foil sweep needs. https://pub.dev/packages/flutter_animate
  flutter_animate: ^4.5.0

  # Backup — the ledger is exported as a single readable JSON file the user
  # owns. share_plus writes it out, file_picker reads it back.
  share_plus: ^10.0.2
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/mcc/
    - assets/brand/

  # Inter, vendored. The variable font covers every weight in one file, so
  # `fontWeight` maps onto the wght axis and there is nothing to fetch before
  # a first build. SIL Open Font Licence 1.1 — see assets/fonts/OFL.txt.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
